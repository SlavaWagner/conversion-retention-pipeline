<svg class="swa-circuit-svg" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
      
      <defs>
    <style>
      .dbt-node { stroke: #14161c; stroke-width: 1.2; fill: #08090d; }
      .dbt-node-icon { fill: #11131a; }
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Courier New", monospace, sans-serif; }
    </style>
  
        <marker id="arrow-marker" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#3cea27" />
        </marker>
        <marker id="arrow-marker-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#60a5fa" />
        </marker>
        <marker id="arrow-marker-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#7c62ff" />
        </marker>
      </defs>
  <rect width="100%" height="100%" rx="12" fill="#050505" stroke="#14161c" stroke-width="1.5"/>

      <!-- ==================== SIGNAL LEITUNGEN (VERBINDUNGEN) ==================== -->
      
      <!-- 1. Quellen nach unten in den Asset Recombiner Core (Grün #3cea27) -->
      <path d="M 135 93 C 135 125, 195 125, 195 155" stroke="#3cea27" stroke-width="2" fill="none" marker-end="url(#arrow-marker)" />
      <path d="M 365 93 C 365 125, 305 125, 305 155" stroke="#3cea27" stroke-width="2" fill="none" marker-end="url(#arrow-marker)" />
      
      <!-- 2. Recombiner Core senkrecht nach unten in den Super Ads Mutator (Blau #60a5fa) -->
      <path d="M 250 210 L 250 270" stroke="#60a5fa" stroke-width="2.5" fill="none" marker-end="url(#arrow-marker-blue)" />
      
      <!-- 3. Super Ads Mutator fächert nach unten in die 3 Output Entitäten auf (Violett #7c62ff) -->
      <path d="M 250 325 C 250 360, 95 355, 95 385" stroke="#7c62ff" stroke-width="2" fill="none" marker-end="url(#arrow-marker-purple)" />
      <path d="M 250 325 L 250 385" stroke="#7c62ff" stroke-width="2" fill="none" marker-end="url(#arrow-marker-purple)" />
      <path d="M 250 325 C 250 360, 405 355, 405 385" stroke="#7c62ff" stroke-width="2" fill="none" marker-end="url(#arrow-marker-purple)" />


      <!-- ==================== TIER 1: QUELLEN / SOURCES (OBEN) ==================== -->
      
      <!-- Top Left Source: Historical Metrics -->
      <g class="node-group">
        <rect class="dbt-node" x="35" y="40" width="200" height="53" />
        <rect class="dbt-node-icon" x="43" y="51" width="30" height="30" />
        <g transform="translate(53, 66)"><text fill="#8e96a3" font-size="8" font-family="monospace" font-weight="bold" text-anchor="middle" y="3">SRC</text></g>
        <text x="79" y="62" fill="#ffffff" font-size="8.5" font-family="monospace">Historical Ads Metrics</text>
        <text x="79" y="76" fill="#8e96a3" font-size="7" font-family="monospace">Pool: &gt;= 1.000 Ads Assets</text>
      </g>
      
      <!-- Top Right Source: Performance Group Factor -->
      <g class="node-group">
        <rect class="dbt-node" x="265" y="40" width="200" height="53" />
        <rect class="dbt-node-icon" x="273" y="51" width="30" height="30" />
        <g transform="translate(283, 66)"><text fill="#8e96a3" font-size="8" font-family="monospace" font-weight="bold" text-anchor="middle" y="3">SRC</text></g>
        <text x="309" y="62" fill="#ffffff" font-size="8.5" font-family="monospace">Performance Group</text>
        <text x="309" y="76" fill="#8e96a3" font-size="7" font-family="monospace">PMax Asset Scoring</text>
      </g>
      

      <!-- ==================== TIER 2: ASSET RECOMBINER CORE (MITTE-OBEN) ==================== -->
      
      <!-- Middle Row 1: Asset Recombiner Core (No Logo Version) -->
      <g class="node-group">
        <rect class="dbt-node" x="145" y="155" width="210" height="55" />
        <rect class="dbt-node-icon" x="153" y="167" width="30" height="30" />
        <g transform="translate(163, 182)"><text fill="#8e96a3" font-size="8" font-family="monospace" font-weight="bold" text-anchor="middle" y="3">MDL</text></g>
        <text x="189" y="177" fill="#ffffff" font-size="8.5" font-family="monospace">Asset Recombiner Core</text>
        <text x="189" y="191" fill="#8e96a3" font-size="7" font-family="monospace">Processes 1.000+ Assets</text>
        <rect x="295" y="149" width="50" height="12" rx="0" ry="0" fill="#34d399" />
        <text x="320" y="157" fill="#ffffff" font-size="6.5" font-family="monospace" font-weight="bold" text-anchor="middle">RECOMBINE</text>
      </g>
      

      <!-- ==================== TIER 3: SUPER ADS MUTATOR (MITTE-UNTEN) ==================== -->
      
      <!-- Middle Row 2: Super Ads Mutator -->
      <g class="node-group">
        <rect class="dbt-node" x="145" y="270" width="210" height="55" />
        <rect class="dbt-node-icon" x="153" y="282" width="30" height="30" />
        <g transform="translate(163, 297)"><text fill="#8e96a3" font-size="8" font-family="monospace" font-weight="bold" text-anchor="middle" y="3">TBL</text></g>
        <text x="189" y="292" fill="#ffffff" font-size="8.5" font-family="monospace">Super Ads Mutator</text>
        <text x="189" y="306" fill="#34d399" font-size="7" font-family="monospace">Pulls best RSA assets</text>
        <rect x="295" y="264" width="50" height="12" rx="0" ry="0" fill="#34d399" />
        <text x="320" y="272" fill="#ffffff" font-size="6.5" font-family="monospace" font-weight="bold" text-anchor="middle">ENABLED</text>
      </g>


      <!-- ==================== TIER 4: OUTPUT ENTITÄTEN (UNTEN) ==================== -->
      
      <!-- Box 1: 15 Headlines -->
      <g class="node-group">
        <rect class="dbt-node" x="25" y="385" width="140" height="55" />
        <rect class="dbt-node-icon" x="31" y="396" width="24" height="24" />
        <g transform="translate(43, 408)"><text fill="#7c62ff" font-size="7" font-family="monospace" font-weight="bold" text-anchor="middle" y="2">OUT</text></g>
        <text x="59" y="407" fill="#ffffff" font-size="8" font-family="monospace">15 Headlines</text>
        <text x="59" y="419" fill="#8e96a3" font-size="6.5" font-family="monospace">Selected Best</text>
        <rect x="133" y="379" width="26" height="12" rx="0" ry="0" fill="#7c62ff" />
        <text x="146" y="387" fill="#ffffff" font-size="6" font-family="monospace" font-weight="bold" text-anchor="middle">HL</text>
      </g>

      <!-- Box 2: 4 Long Headlines -->
      <g class="node-group">
        <rect class="dbt-node" x="180" y="385" width="140" height="55" />
        <rect class="dbt-node-icon" x="186" y="396" width="24" height="24" />
        <g transform="translate(198, 408)"><text fill="#7c62ff" font-size="7" font-family="monospace" font-weight="bold" text-anchor="middle" y="2">OUT</text></g>
        <text x="214" y="407" fill="#ffffff" font-size="8" font-family="monospace">4 Long Headlines</text>
        <text x="214" y="419" fill="#8e96a3" font-size="6.5" font-family="monospace">Selected Best</text>
        <rect x="288" y="379" width="26" height="12" rx="0" ry="0" fill="#7c62ff" />
        <text x="301" y="387" fill="#ffffff" font-size="6" font-family="monospace" font-weight="bold" text-anchor="middle">LHL</text>
      </g>

      <!-- Box 3: 4 Descriptions -->
      <g class="node-group">
        <rect class="dbt-node" x="335" y="385" width="140" height="55" />
        <rect class="dbt-node-icon" x="341" y="396" width="24" height="24" />
        <g transform="translate(353, 408)"><text fill="#7c62ff" font-size="7" font-family="monospace" font-weight="bold" text-anchor="middle" y="2">OUT</text></g>
        <text x="369" y="407" fill="#ffffff" font-size="8" font-family="monospace">4 Descriptions</text>
        <text x="369" y="419" fill="#8e96a3" font-size="6.5" font-family="monospace">Selected Best</text>
        <rect x="443" y="379" width="26" height="12" rx="0" ry="0" fill="#7c62ff" />
        <text x="456" y="387" fill="#ffffff" font-size="6" font-family="monospace" font-weight="bold" text-anchor="middle">DESC</text>
      </g>
      
    </svg>